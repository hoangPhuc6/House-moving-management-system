spring.application.name=house-moving-service
server.port=${SERVER_PORT:8080}

# 1. Kết nối DB với giá trị mặc định (Fallback)
# Nếu không truyền biến, mặc định sẽ là localhost:5432 và DB là house_moving_db
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:house_moving_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 3. Format thời gian
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# 4. JWT Configuration
jwt.secret=${JWT_SECRET:9a618248b64db62d15b300a07b00580bbe456fa385cbd97422dd25f212f6b021}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

springdoc.api-docs.enabled: true
springdoc.swagger-ui.enabled: true

open.api.serverUrl: ${API_SERVER_URL:http://localhost:8080}
open.api.serverName: Local Development Server
open.api.title: Open API Document
open.api.version: v1.0.0
open.api.description: Mo ta API Service

# 5. Pricing Engine & Map Routing Configuration
app.pricing.min-lead-hours=2
app.pricing.base-transport-included-km=10.0
app.pricing.haversine-winding-factor=1.3

app.map.enabled=true
app.map.provider=GOONG
app.map.api-key=${MAP_API_KEY}
app.map.connect-timeout-ms=2000
app.map.read-timeout-ms=3000
