server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: house-moving-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:house_moving_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    date-format: yyyy-MM-dd HH:mm:ss

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:9a618248b64db62d15b300a07b00580bbe456fa385cbd97422dd25f212f6b021}
    expiration: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:86400000}
  pricing:
    min-lead-hours: 2
    base-transport-included-km: 10.0
    haversine-winding-factor: 1.3
  map:
    enabled: true
    provider: GOONG
    api-key: ${MAP_API_KEY}
    connect-timeout-ms: 2000
    read-timeout-ms: 3000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

open:
  api:
    serverUrl: ${API_SERVER_URL:http://localhost:8080}
    serverName: Local Development Server
    title: Open API Document
    version: v1.0.0
    description: Mo ta API Service
