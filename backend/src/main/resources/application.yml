server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: house-moving-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:house_moving_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      # Giới hạn chung theo file lớn nhất (video 50MB); giới hạn riêng từng loại do SurveyAttachmentPolicy kiểm tra
      max-file-size: 50MB
      max-request-size: 55MB
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    date-format: yyyy-MM-dd HH:mm:ss

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:9a618248b64db62d15b300a07b00580bbe456fa385cbd97422dd25f212f6b021}
    expiration: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:86400000}
  pricing:
    min-lead-hours: 2
    base-transport-included-km: 10.0
    haversine-winding-factor: 1.3
  survey:
    early-start-minutes: 60
    max-attachments: 50
    max-video-attachments: 5
  storage:
    # Để trống = chưa cấu hình lưu trữ: app vẫn chạy, API upload báo ERR_FILE_STORAGE. Dùng MinIO: STORAGE_PROVIDER=MINIO
    provider: ${STORAGE_PROVIDER:}
    url-ttl-minutes: 15
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_BUCKET:house-moving}
  map:
    enabled: true
    provider: GOONG
    api-key: ${MAP_API_KEY}
    connect-timeout-ms: 2000
    read-timeout-ms: 3000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

open:
  api:
    serverUrl: ${API_SERVER_URL:http://localhost:8080}
    serverName: Local Development Server
    title: Open API Document
    version: v1.0.0
    description: Mo ta API Service
