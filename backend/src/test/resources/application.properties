# Chỉ áp dụng khi chạy test (nằm trong classpath test, được nạp thêm bên cạnh src/main/resources/application.yml).
# Mỗi cấu hình @SpringBootTest khác nhau (khác @MockitoBean / @TestConfiguration) dựng một Spring context riêng và được
# giữ lại để dùng lại; mỗi context giữ một pool kết nối DB (mặc định 10). Với hơn 20 class @SpringBootTest, tổng số kết nối
# vượt giới hạn mặc định 100 của PostgreSQL ("too many clients already"). Thu nhỏ pool cho test để không chạm giới hạn.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
